<svg xmlns="http://www.w3.org/2000/svg" width="996" height="456" viewBox="0 0 996 456"><!-- backdrop -->
<defs>
<linearGradient id="bd-base" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset=".5" stop-color="#4c1d95"/><stop offset="1" stop-color="#831843"/></linearGradient>
<radialGradient id="bd-sky" cx=".1" cy="0" r=".8"><stop offset="0" stop-color="#38bdf8" stop-opacity=".35"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
<radialGradient id="bd-rose" cx="1" cy="1" r=".8"><stop offset="0" stop-color="#ec4899" stop-opacity=".4"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
<filter id="bd-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".5"/></filter>
</defs>
<rect width="996" height="456" rx="16" fill="url(#bd-base)"/>
<rect width="996" height="456" rx="16" fill="url(#bd-sky)"/>
<rect width="996" height="456" rx="16" fill="url(#bd-rose)"/>
<rect x="48" y="48" width="900" height="360" rx="10" fill="#000" filter="url(#bd-shadow)"/>
<svg x="48" y="48" xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="900" height="360" rx="12" fill="#ffffff"/>

  <!-- Your machine -->
  <rect x="16" y="16" width="868" height="328" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 4"/>
  <text x="32" y="40" font-size="13" fill="#64748b">your machine — nothing leaves it except the chat you already use</text>

  <!-- Terminal agent -->
  <rect x="40" y="70" width="240" height="150" rx="10" fill="#ecfeff" stroke="#06b6d4"/>
  <text x="160" y="98" font-size="16" font-weight="600" text-anchor="middle" fill="#0e7490">agent (terminal)</text>
  <text x="160" y="124" font-size="13" text-anchor="middle" fill="#334155">builds the prompt</text>
  <text x="160" y="144" font-size="13" text-anchor="middle" fill="#334155">parses tool calls from the reply</text>
  <text x="160" y="164" font-size="13" text-anchor="middle" fill="#334155">reads, searches, runs commands</text>
  <text x="160" y="184" font-size="13" text-anchor="middle" fill="#334155">edits as diffs you approve</text>
  <text x="160" y="204" font-size="12" text-anchor="middle" fill="#64748b">Node · server/</text>

  <!-- Chrome extension -->
  <rect x="340" y="70" width="220" height="150" rx="10" fill="#fefce8" stroke="#eab308"/>
  <text x="450" y="98" font-size="16" font-weight="600" text-anchor="middle" fill="#a16207">Chrome extension</text>
  <text x="450" y="124" font-size="13" text-anchor="middle" fill="#334155">types the prompt</text>
  <text x="450" y="144" font-size="13" text-anchor="middle" fill="#334155">into the Gemini tab</text>
  <text x="450" y="164" font-size="13" text-anchor="middle" fill="#334155">streams the reply back</text>
  <text x="450" y="184" font-size="13" text-anchor="middle" fill="#334155">side panel + floating window</text>
  <text x="450" y="204" font-size="12" text-anchor="middle" fill="#64748b">MV3 · extension/</text>

  <!-- Gemini tab -->
  <rect x="620" y="70" width="240" height="150" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="740" y="98" font-size="16" font-weight="600" text-anchor="middle" fill="#4338ca">gemini.google.com</text>
  <text x="740" y="124" font-size="13" text-anchor="middle" fill="#334155">a normal browser tab,</text>
  <text x="740" y="144" font-size="13" text-anchor="middle" fill="#334155">signed in as you</text>
  <text x="740" y="164" font-size="13" text-anchor="middle" fill="#334155">no API key anywhere</text>

  <!-- Arrows -->
  <line x1="282" y1="145" x2="336" y2="145" stroke="#6b7280" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="309" y="136" font-size="11" text-anchor="middle" fill="#64748b">WebSocket</text>
  <text x="309" y="166" font-size="11" text-anchor="middle" fill="#64748b">127.0.0.1</text>
  <line x1="562" y1="145" x2="616" y2="145" stroke="#6b7280" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Repo -->
  <rect x="40" y="252" width="240" height="72" rx="10" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="160" y="280" font-size="15" font-weight="600" text-anchor="middle" fill="#15803d">your repo</text>
  <text x="160" y="302" font-size="12" text-anchor="middle" fill="#334155">code · AGENT.md · .agent/ (state)</text>
  <line x1="160" y1="222" x2="160" y2="248" stroke="#6b7280" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Editor -->
  <rect x="340" y="252" width="220" height="72" rx="10" fill="#f5f3ff" stroke="#a855f7"/>
  <text x="450" y="280" font-size="15" font-weight="600" text-anchor="middle" fill="#7e22ce">VS Code companion <tspan font-size="12" font-weight="400" fill="#64748b">(optional)</tspan></text>
  <text x="450" y="302" font-size="12" text-anchor="middle" fill="#334155">chat panel · diffs · selection · errors</text>
  <path d="M338 288 L300 288 L300 180 L284 180" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>
</svg>
