<text x="16" y="839" xml:space="preserve" textLength="577.1" lengthAdjust="spacingAndGlyphs"><tspan fill="#d4d4d4">11 with a newer release — an upgrade to choose, not a repair.</tspan></text>
<text x="16" y="858" xml:space="preserve" textLength="567.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#d4d4d4" fill-opacity="0.5">────────────────────────────────────────────────────────────</tspan></text>
<text x="16" y="896" xml:space="preserve" textLength="832.5" lengthAdjust="spacingAndGlyphs"><tspan fill="#d4d4d4">/doctor &lt;package&gt; says why it is here and what imports it · /doctor fix runs npm install</tspan></text>
<text x="16" y="915" xml:space="preserve" textLength="690.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#ff9e64">✗ unpdf not installed · /doctor fix installs, /doctor says why it matters</tspan></text>
