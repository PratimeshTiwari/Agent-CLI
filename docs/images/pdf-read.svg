<text x="470.0" y="20" fill="#8a8a8a" font-size="12" text-anchor="middle">agent — read_file reads PDF, Word and PowerPoint as Markdown</text>
<rect x="16.0" y="46" width="908.2" height="19" fill="#2a2f45"/>
<text x="16" y="60" xml:space="preserve" textLength="596.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#7aa2f7" font-weight="bold">▌</tspan><tspan fill="#e6e6e6" font-weight="bold">  what does docs/late-fee-policy.pdf ask of the invoice model?</tspan></text>
<text x="16" y="98" xml:space="preserve" textLength="406.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#d4d4d4" font-weight="bold">● </tspan><tspan fill="#d4d4d4">Reading the policy and the invoice model.</tspan></text>
<text x="16" y="136" xml:space="preserve" textLength="501.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#d4d4d4">  </tspan><tspan fill="#9ece6a">● </tspan><tspan fill="#d4d4d4" font-weight="bold">Read(docs/late-fee-policy.pdf)</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#d4d4d4" fill-opacity="0.5">·</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#d4d4d4" fill-opacity="0.5">9 lines · 1.1 KB</tspan></text>
<text x="16" y="174" xml:space="preserve" textLength="529.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#d4d4d4">  </tspan><tspan fill="#9ece6a">● </tspan><tspan fill="#d4d4d4" font-weight="bold">Read(app/models/billing/invoice.rb)</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#d4d4d4" fill-opacity="0.5">·</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#d4d4d4" fill-opacity="0.5">5 lines · 80 B</tspan></text>
<text x="16" y="212" xml:space="preserve" textLength="558.1" lengthAdjust="spacingAndGlyphs"><tspan fill="#d4d4d4" font-weight="bold">● </tspan><tspan fill="#d4d4d4">The policy asks for three things Invoice does not do yet:</tspan></text>
<text x="16" y="250" xml:space="preserve" textLength="397.3" lengthAdjust="spacingAndGlyphs"><tspan fill="#d4d4d4">  </tspan><tspan fill="#d4d4d4" fill-opacity="0.5">◦</tspan><tspan fill="#d4d4d4"> a </tspan><tspan fill="#d4d4d4" font-weight="bold">grace period</tspan><tspan fill="#d4d4d4"> of 14 days after due_on</tspan></text>
<text x="16" y="269" xml:space="preserve" textLength="558.1" lengthAdjust="spacingAndGlyphs"><tspan fill="#d4d4d4">  </tspan><tspan fill="#d4d4d4" fill-opacity="0.5">◦</tspan><tspan fill="#d4d4d4"> a </tspan><tspan fill="#d4d4d4" font-weight="bold">fee of 2%</tspan><tspan fill="#d4d4d4"> of the total, at most once a calendar month</tspan></text>
<text x="16" y="288" xml:space="preserve" textLength="302.7" lengthAdjust="spacingAndGlyphs"><tspan fill="#d4d4d4">  </tspan><tspan fill="#d4d4d4" fill-opacity="0.5">◦</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#d4d4d4" font-weight="bold">no fee</tspan><tspan fill="#d4d4d4"> on invoices under $50</tspan></text>
<text x="16" y="326" xml:space="preserve" textLength="889.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#d4d4d4">  The model has due_on and total but no fee logic. Want me to add a late_fee method with those</tspan></text>
<text x="16" y="345" xml:space="preserve" textLength="75.7" lengthAdjust="spacingAndGlyphs"><tspan fill="#d4d4d4">  rules?</tspan></text>
<text x="16" y="383" xml:space="preserve" textLength="501.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#8b93b0">✻ Worked for 0.9s · 1 round · 2 reads · done 11:32 PM</tspan></text>
<text x="16" y="421" xml:space="preserve" textLength="908.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#e0af68">────────────────────────────────────────────────────────────────────────────────────────────────</tspan></text>
<rect x="34.9" y="426" width="9.5" height="19" fill="#d4d4d4"/>
<text x="16" y="440" xml:space="preserve" textLength="312.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#e0af68" font-weight="bold">❯ </tspan><tspan fill="#1e1e1e">A</tspan><tspan fill="#d4d4d4" fill-opacity="0.5">sk anything, or / for commands</tspan></text>
<text x="16" y="459" xml:space="preserve" textLength="908.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#e0af68">────────────────────────────────────────────────────────────────────────────────────────────────</tspan></text>
<text x="16" y="497" xml:space="preserve" textLength="889.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#e0af68">⏸</tspan><tspan fill="#d4d4d4" fill-opacity="0.5"> plan mode</tspan><tspan fill="#d4d4d4">                                                                    </tspan><tspan fill="#d4d4d4" fill-opacity="0.5">high · ▰▱▱▱▱ 5%</tspan></text>
