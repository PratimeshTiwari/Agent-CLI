<text x="470.0" y="20" fill="#8a8a8a" font-size="12" text-anchor="middle">agent — effort and the browser differ: it asks before sending</text>
<text x="16" y="60" xml:space="preserve" textLength="908.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#ff9e64">⚠ tab is on </tspan><tspan fill="#ff9e64" font-weight="bold">3.8 Flash</tspan><tspan fill="#ff9e64"> · effort High wants </tspan><tspan fill="#ff9e64" font-weight="bold">3.1 Pro</tspan><tspan fill="#ff9e64"> · your next message asks first</tspan><tspan fill="#ff9e64" fill-opacity="0.5">  ·  ctrl+b sho…</tspan></text>
<text x="16" y="79" xml:space="preserve" textLength="908.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#ff9e64">────────────────────────────────────────────────────────────────────────────────────────────────</tspan></text>
<text x="16" y="98" xml:space="preserve" textLength="246.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#d4d4d4"> </tspan><tspan fill="#ff9e64" font-weight="bold">Effort and browser differ</tspan></text>
<text x="16" y="117" xml:space="preserve" textLength="558.1" lengthAdjust="spacingAndGlyphs"><tspan fill="#d4d4d4" fill-opacity="0.5"> Effort is High (3.1 Pro); the browser tab is on 3.8 Flash.</tspan></text>
<text x="16" y="155" xml:space="preserve" textLength="766.3" lengthAdjust="spacingAndGlyphs"><tspan fill="#7aa2f7"> ❯ 1. </tspan><tspan fill="#7aa2f7" font-weight="bold">Switch the browser to 3.1 Pro</tspan><tspan fill="#d4d4d4" fill-opacity="0.5">  then send · steps down if it will not switch</tspan></text>
<text x="16" y="174" xml:space="preserve" textLength="785.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#7aa2f7">   </tspan><tspan fill="#d4d4d4" fill-opacity="0.5">2. </tspan><tspan fill="#d4d4d4">Send on 3.8 Flash           </tspan><tspan fill="#d4d4d4" fill-opacity="0.5">  with Medium&#x27;s prompt · not asked again for this</tspan></text>
<text x="16" y="193" xml:space="preserve" textLength="633.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#7aa2f7">   </tspan><tspan fill="#d4d4d4" fill-opacity="0.5">3. </tspan><tspan fill="#d4d4d4">Set effort to Medium        </tspan><tspan fill="#d4d4d4" fill-opacity="0.5">  matches the browser from now on</tspan></text>
<text x="16" y="231" xml:space="preserve" textLength="586.5" lengthAdjust="spacingAndGlyphs"><tspan fill="#d4d4d4" fill-opacity="0.5"> enter choose · esc cancel — your message goes back in the box</tspan></text>
<text x="16" y="269" xml:space="preserve" textLength="889.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#e0af68">⏸</tspan><tspan fill="#d4d4d4" fill-opacity="0.5"> plan mode · shift+tab to cycle</tspan><tspan fill="#d4d4d4">                                                   </tspan><tspan fill="#ff9e64">⚠ 3.8 Flash</tspan></text>
