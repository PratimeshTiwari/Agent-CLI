<text x="470.0" y="20" fill="#8a8a8a" font-size="12" text-anchor="middle">agent — /doctor unpdf: why it is used, and what you can do</text>
<text x="16" y="60" xml:space="preserve" textLength="132.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#d4d4d4"> </tspan><tspan fill="#7aa2f7" font-weight="bold">unpdf</tspan><tspan fill="#d4d4d4" fill-opacity="0.5">  server</tspan></text>
<text x="16" y="98" xml:space="preserve" textLength="567.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#d4d4d4"> Tier        optional — one feature stops working without it</tspan></text>
<text x="16" y="117" xml:space="preserve" textLength="898.7" lengthAdjust="spacingAndGlyphs"><tspan fill="#d4d4d4"> Why         Extracts the text of a PDF so read_file can hand it to the model as Markdown, page</tspan></text>
<text x="16" y="136" xml:space="preserve" textLength="198.7" lengthAdjust="spacingAndGlyphs"><tspan fill="#d4d4d4">             by page.</tspan></text>
<text x="16" y="155" xml:space="preserve" textLength="766.3" lengthAdjust="spacingAndGlyphs"><tspan fill="#d4d4d4"> Without it  read_file fails on PDFs. Word, PowerPoint and text files still read.</tspan></text>
<text x="16" y="174" xml:space="preserve" textLength="539.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#d4d4d4"> Versions    installed 1.8.1 · wants 1.8.1 · latest 1.9.1</tspan></text>
<text x="16" y="193" xml:space="preserve" textLength="368.9" lengthAdjust="spacingAndGlyphs"><tspan fill="#d4d4d4"> Imported by src/mcp/tools/documents.js</tspan></text>
<text x="16" y="231" xml:space="preserve" textLength="520.3" lengthAdjust="spacingAndGlyphs"><tspan fill="#7aa2f7"> ❯ </tspan><tspan fill="#7aa2f7" font-weight="bold">Update to latest </tspan><tspan fill="#d4d4d4" fill-opacity="0.5">  1.9.1 · outside the current range</tspan></text>
<text x="16" y="250" xml:space="preserve" textLength="586.5" lengthAdjust="spacingAndGlyphs"><tspan fill="#7aa2f7">   </tspan><tspan fill="#d4d4d4">Uninstall        </tspan><tspan fill="#d4d4d4" fill-opacity="0.5">  npm uninstall · read_file fails on PDFs.</tspan></text>
<text x="16" y="269" xml:space="preserve" textLength="501.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#7aa2f7">   </tspan><tspan fill="#d4d4d4">Choose a version…</tspan><tspan fill="#d4d4d4" fill-opacity="0.5">  every release, to go up or down</tspan></text>
<text x="16" y="307" xml:space="preserve" textLength="321.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#d4d4d4" fill-opacity="0.5"> ↑↓ move · enter choose · esc back</tspan></text>
